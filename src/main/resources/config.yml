# ═══════════════════════════════════════════════════════════════
# Lifesteal Plugin Configuration
# All values here control the behavior of the Lifesteal system
# For support: Check README.md or plugin documentation
# ═══════════════════════════════════════════════════════════════

# --- GENERAL SETTINGS ---
settings:
  # Starting hearts for new players on first join
  default-hearts: 10
  
  # Maximum hearts a player can reach
  max-hearts: 20
  
  # Hearts required to stay alive (0 = death/ban)
  min-hearts: 0
  
  # Synchronize player max health with heart count
  adjust-max-health: true
  
  # Maximum players allowed per team
  max-team-size: 10
  
  # Automatically ban players when they reach 0 hearts
  ban-on-zero-hearts: true

# --- DEATH & HEARTS SYSTEM ---
# These settings control heart loss/gain mechanics
death:
  # Hearts lost by a player when they die (0 = disabled)
  hearts-lost-on-death: 1
  
  # Hearts gained by a killer when they kill someone
  hearts-gained-on-kill: 1
  
  # Require there to be an actual killer to gain hearts
  # If false, player gains hearts on any death
  killer-required: false

# --- HEART ITEM SETTINGS ---
# Configure the physical heart items from /withdraw
hearts:
  item:
    # Material used for heart items (valid Minecraft material)
    material: RED_DYE
    
    # Display name when held
    name: "§cHeart"
    
    # Lore text shown on item
    lore:
      - "§7Use this to gain"
      - "§7+1 Max Heart"
    
    # Max health increase per heart item used
    health-increase-per-item: 2

# --- LOTTERY SYSTEM ---
# Hourly random drawing with prizes
lottery:
  # Price per lottery ticket
  ticket-price: 100
  
  # Enable/disable lottery system entirely
  enabled: true

# --- DAILY REWARDS ---
# Automatic daily claim system
daily-reward:
  # Money given per claim (requires Vault)
  money: 100
  
  # Points given per claim (requires PlayerPoints)
  points: 100
  
  # Enable/disable daily reward system
  enabled: true

# --- TEAM SYSTEM ---
teams:
  # Minimum characters for team name
  min-team-name-length: 3
  
  # Maximum characters for team name
  max-team-name-length: 16
  
  # Maximum players per team
  max-team-size: 10
  
  # Team chat configuration
  chat:
    # Prefix shown in team chat messages
    prefix: "§6[Team]"
    
    # Enable/disable team chat entirely
    enabled: true
    
    # Character that activates team chat (e.g., !message)
    activation-character: "!"

# --- TEAM WARS ---
# Team vs Team competitive battles
team-wars:
  # Enable/disable team wars
  enabled: true
  
  # Money reward per defeated enemy member
  # Example: $5000 per enemy if team has 5 members
  reward-per-member: 1000.0
  
  # Both leaders must accept before war starts
  require-both-leaders: true
  
  # Cooldown (in minutes) after war ends before teams can war again
  cooldown-minutes: 60

# --- BUNDLE SYSTEM ---
# Daily reward bundles with randomized prizes
bundles:
  # Number of bundles players get per day
  max-per-day: 3
  
  # Hours until bundle count resets
  reset-time-hours: 24
  
  # Hours until next random reward is generated
  reward-refresh-hours: 12
  
  # Possible rewards (add/remove/modify as needed)
  possible-rewards:
    money:
      type: "MONEY"
      min-amount: 100
      max-amount: 500
    points:
      type: "POINTS"
      min-amount: 50
      max-amount: 250
    hearts:
      type: "HEARTS"
      min-amount: 1
      max-amount: 3
    orbits:
      type: "ORBITS"
      min-amount: 10
      max-amount: 50
    diamonds:
      type: "ITEM_DIAMOND"
      min-amount: 1
      max-amount: 5
    emeralds:
      type: "ITEM_EMERALD"
      min-amount: 1
      max-amount: 10
    iron:
      type: "ITEM_IRON_INGOT"
      min-amount: 5
      max-amount: 15
    gold:
      type: "ITEM_GOLD_INGOT"
      min-amount: 3
      max-amount: 12

# --- GUI SETTINGS ---
gui:
  team:
    # Enable/disable team GUI
    enabled: true
    
    # Inventory rows (27 for 3x9, 36 for 4x9, 45 for 5x9)
    inventory-size: 27

# --- DEBUG OPTIONS ---
# Enable for troubleshooting and detailed logging
debug:
  # Log full stack traces for errors
  log-stacktraces: false
  
  # Enable verbose debug logging
  enable-logging: false
