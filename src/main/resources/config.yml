# ═══════════════════════════════════════════════════════════════
# Lifesteal Plugin Configuration
# All values here control the behavior of the Lifesteal system
# For support: Check README.md or plugin documentation
# ═══════════════════════════════════════════════════════════════

# --- GENERAL SETTINGS ---
settings:
  # Starting hearts for new players on first join
  default-hearts: 10
  
  # Maximum hearts a player can reach
  max-hearts: 20
  
  # Hearts required to stay alive (0 = death/ban)
  min-hearts: 0
  
  # Synchronize player max health with heart count
  adjust-max-health: true
  
  # Maximum players allowed per team
  max-team-size: 10
  
  # Automatically ban players when they reach 0 hearts
  ban-on-zero-hearts: true

# --- DEATH & HEARTS SYSTEM ---
# These settings control heart loss/gain mechanics
death:
  # Hearts lost by a player when they die (0 = disabled)
  hearts-lost-on-death: 1
  
  # Hearts gained by a killer when they kill someone
  hearts-gained-on-kill: 1
  
  # Require there to be an actual killer to gain hearts
  # If false, player gains hearts on any death
  killer-required: false

# --- HEART ITEM SETTINGS ---
# Configure the physical heart items from /withdraw
hearts:
  # Item used when a player withdraws hearts into an inventory item
  withdraw:
    material: REDSTONE_BLOCK

  item:
    # Material used for heart items (valid Minecraft material)
    material: RED_DYE
    
    # Display name when held
    name: "§cHeart"
    
    # Lore text shown on item
    lore:
      - "§7Use this to gain"
      - "§7+1 Max Heart"
    
    # Max health increase per heart item used
    health-increase-per-item: 2

# --- LOTTERY SYSTEM ---
# Hourly random drawing with prizes
lottery:
  # Price per lottery ticket
  ticket-price: 100
  
  # Enable/disable lottery system entirely
  enabled: true

# --- HEART SHOP ---
# Buy hearts with PlayerPoints
heartshop:
  # Enable/disable heart shop
  enabled: true
  
  # Prices for different heart packages
  prices:
    1-heart: 1000
    5-hearts: 4500
    10-hearts: 8000

# --- TEAM SYSTEM ---
teams:
  # Minimum characters for team name
  min-team-name-length: 3
  
  # Maximum characters for team name
  max-team-name-length: 16
  
  # Maximum players per team
  max-team-size: 10
  
  # Team chat configuration
  chat:
    # Prefix shown in team chat messages
    prefix: "§6[Team]"
    
    # Enable/disable team chat entirely
    enabled: true
    
    # Character that activates team chat (e.g., !message)
    activation-character: "!"

# --- TEAM WARS ---
# Team vs Team competitive battles
team-wars:
  # Enable/disable team wars
  enabled: true
  
  # Money reward per defeated enemy member
  # Example: $5000 per enemy if team has 5 members
  reward-per-member: 1000.0
  
  # Both leaders must accept before war starts
  require-both-leaders: true
  
  # Cooldown (in minutes) after war ends before teams can war again
  cooldown-minutes: 60

# --- BUNDLE SYSTEM ---
# Daily reward bundles with randomized prizes
bundles:
  # Players automatically receive this many bundles each reset; each opening grants one random configured reward.
  max-per-day: 3
  
  # Hours until daily bundles become available again
  reset-time-hours: 24
  
  # Bundle opening animation timing (in server ticks; 20 ticks = 1 second)
  animation:
    duration-ticks: 40
    cycle-ticks: 3
  
  # Possible rewards (add/remove/modify as needed)
  possible-rewards:
    money:
      type: "MONEY"
      min-amount: 100
      max-amount: 500
    points:
      type: "POINTS"
      min-amount: 50
      max-amount: 250
    hearts:
      type: "HEARTS"
      min-amount: 1
      max-amount: 3
    orbits:
      type: "ORBITS"
      min-amount: 10
      max-amount: 50
    diamonds:
      type: "ITEM_DIAMOND"
      min-amount: 1
      max-amount: 5
    emeralds:
      type: "ITEM_EMERALD"
      min-amount: 1
      max-amount: 10
    iron:
      type: "ITEM_IRON_INGOT"
      min-amount: 5
      max-amount: 15
    gold:
      type: "ITEM_GOLD_INGOT"
      min-amount: 3
      max-amount: 12

# --- GUI SETTINGS ---
gui:
  # Inventory titles support MiniMessage tags, for example: <dark_red><bold>Hearts</bold></dark_red>
  titles:
    menu: "<dark_red><bold>CGLifesteal</bold></dark_red>"
    bundles: "<light_purple><bold>Daily Bundles</bold></light_purple>"
    bundle-spin: "<light_purple><bold>Opening Bundle</bold></light_purple>"
    heartshop: "<red><bold>Heart Shop</bold></red>"
    lottery: "<gold><bold>Lottery</bold></gold>"
    team-main: "<gold>Team: {team}</gold>"
    team-members: "<gold>Team Members ({count})</gold>"

  # Use valid item material names. Invalid values fall back to the defaults.
  theme:
    background: BLACK_STAINED_GLASS_PANE
    accent: RED_STAINED_GLASS_PANE
    secondary: GRAY_STAINED_GLASS_PANE

  # Optional icon overrides for the main menu. Any valid item material is accepted.
  materials:
    menu:
      bundles: CHEST
      heartshop: RED_DYE
      lottery: EMERALD
      teams: PLAYER_HEAD
      stats: BOOK
      close: BARRIER

  # Slot numbers are zero-based. Keep each slot within its inventory.
  slots:
    menu:
      bundles: 20
      heartshop: 22
      lottery: 24
      teams: 29
      stats: 31
      close: 40
    bundles:
      open: 22
      info: 40
      back: 48
      close: 49
    bundle-spin:
      reward: 13
    heartshop:
      one-heart: 19
      five-hearts: 22
      ten-hearts: 25
      close: 49
    lottery:
      pool: 11
      buy: 13
    team-main:
      info: 0
      members: 1
      invite: 2
      chat: 3
      leave: 4
      delete: 5
    team-members:
      back: 26

  team:
    # Enable/disable team GUI
    enabled: true
    
    # Inventory rows (27 for 3x9, 36 for 4x9, 45 for 5x9)
    inventory-size: 27

# --- DEBUG OPTIONS ---
# Enable for troubleshooting and detailed logging
debug:
  # Log full stack traces for errors
  log-stacktraces: false
  
  # Enable verbose debug logging
  enable-logging: false
