# Lifesteal Plugin - Messages Configuration
# Edit these messages to customize the plugin output!
# Use § for color codes, e.g., §a = green, §c = red, §e = yellow
# Color codes: 0-9 = numbers, a-f = letters, r = reset

# Prefixes
prefix:
  main: "§8[§cCGLifesteal§8]"
  team: "§6[Team]"

# General Messages
general:
  no-permission: "§cYou don't have permission!"
  player-not-found: "§cPlayer not found!"
  invalid-amount: "§cInvalid amount!"
  only-players: "§cOnly players can use this command!"
  command-success: "§aCommand executed successfully!"
  command-failed: "§cCommand failed! Check console for errors."
  kick-message: "§cYou have been removed from the server!"
  
# Ban Messages
ban:
  ran-out-of-hearts: "You ran out of hearts"
  notification: "§c{player} ran out of hearts and has been banned!"

# Hearts Messages
hearts:
  view-own: "§aYou have §e{hearts}§a hearts"
  view-other: "§a{player} has §e{hearts}§a hearts"
  give-success: "§aGave §e{amount}§a hearts to §e{player}§a (§e{old}§a -> §e{new}§a)"
  give-notify: "§e{admin}§a gave you §e{amount}§a hearts!"
  take-success: "§aRemoved §e{amount}§a hearts from §e{player}§a (§e{old}§a -> §e{new}§a)"
  take-notify: "§e{admin}§a removed §c{amount}§a hearts from you!"
  set-success: "§aSet hearts for §e{player}§a to §e{amount}"
  set-notify: "§aYour hearts were set to §e{amount}§a!"
  reset-all: "§aReset all players' hearts to §e10"
  reset-notify: "§aAll players' hearts have been reset to §e10"
  max-hearts: "§cCannot exceed maximum of §e{max}§c hearts!"
  min-hearts: "§cHearts cannot go below §e0"

# Withdraw Messages
withdraw:
  success: "§aWithdrew §e{amount}§a hearts! You now have §e{remaining}§a hearts"
  success-dropped: "§aWithdrew §e{amount}§a hearts! (dropped due to full inventory)"
  not-enough: "§cYou don't have enough hearts! You have §e{hearts}§c hearts"
  invalid-amount: "§cAmount must be positive!"

# Deposit Messages
deposit:
  success: "§aDeposited §e{amount}§a hearts! You now have §e{total}§a hearts"
  invalid-item: "§cYou must hold a heart item!"

# Orbits Messages
orbits:
  view-self: "§aYou have §e{orbits}§a orbits"
  view-other: "§a{player} has §e{orbits}§a orbits"
  give-success: "§aGave §e{amount}§a orbits to §e{player}§a (Total: §e{total}§a)"
  give-notify: "§e{admin}§a gave you §e{amount}§a orbits! (Total: §e{total}§a)"
  take-success: "§aRemoved §e{amount}§a orbits from §e{player}§a (Total: §e{total}§a)"
  take-notify: "§e{admin}§a removed §c{amount}§a orbits from you! (Total: §e{total}§a)"

# Death Messages
death:
  no-killer:
    - "§e{player}§c lost a heart to the void!"
    - "§e{player}§c couldn't escape fate!"
    - "§e{player}§c slipped away... and a heart too!"
    - "§e{player}§c met an untimely end!"
    - "§e{player}§c's adventure came to an end!"
    - "§e{player}§c was taken by the unknown!"
    - "§c❤ §e{player}§c lost a heart!"
    - "§e{player}§c fell to the void!"
    - "§e{player}§c respects nature's power!"
  with-killer:
    - "§e{victim}§c was defeated by §e{killer}§c!"
    - "§e{killer}§c claimed a heart from §e{victim}§c!"
    - "§e{victim}§c fell to §e{killer}§c's blade!"
    - "§e{victim}§c was eliminated by §e{killer}§c!"
    - "§e{killer}§c struck down §e{victim}§c!"
    - "§e{victim}§c couldn't match §e{killer}§c!"
    - "§e{killer}§c overpowered §e{victim}§c!"
    - "§c❤ §e{killer}§c defeated §e{victim}§c!"
    - "§e{victim}§c lost to §e{killer}§c's combat!"
    - "§e{victim}§c was outmatched by §e{killer}§c!"
    - "§e{killer}§c proved superior to §e{victim}§c!"

# Team Messages
team:
  not-in-team: "§cYou're not in a team!"
  create-success: "§aTeam §e{name}§a created successfully!"
  create-broadcast: "§e{player}§a created a new team: §e{name}"
  invite-success: "§aInvited §e{player}§a to team §e{team}"
  invite-notify: "§e{inviter}§a invited you to join team §e{team}§a! Use §e/team accept {team}§a or §e/team deny {team}"
  accept-success: "§aYou joined team §e{team}§a!"
  accept-notify: "§e{player}§a joined the team!"
  deny-success: "§aInvite from team §e{team}§a denied!"
  leave-success: "§aYou left team §e{team}§a!"
  leave-notify: "§e{player}§a left the team!"
  no-teams: "§cNo teams exist yet!"
  death-notify: "§c{player} was killed by {killer}!"
  kill-notify: "§a{player} killed {victim}!"

# Shop Messages
shop:
  opened: "§aHeart shop opened! Use points to buy hearts."
  closed: "§aHeart shop closed."
  purchase-success: "§aSuccessfully purchased §e{amount}§a hearts for §e{price}§a points!"
  insufficient-points: "§cInsufficient points! You need §e{price}§c points, you have §e{current}§c points."
  disabled: "§cHeart shop is currently disabled!"
